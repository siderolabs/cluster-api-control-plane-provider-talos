# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
commonLabels:
  cluster.x-k8s.io/v1alpha3: v1alpha3
  cluster.x-k8s.io/v1alpha4: v1alpha3
  cluster.x-k8s.io/v1beta1: v1alpha3
  cluster.x-k8s.io/v1beta2: v1alpha3

# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/controlplane.cluster.x-k8s.io_taloscontrolplanes.yaml
# +kubebuilder:scaffold:crdkustomizeresource

# TalosControlPlane serves a single API version, so the CRD uses the default
# (None) conversion strategy and does not depend on a conversion webhook.
# [WEBHOOK] To enable a conversion webhook once a second version is added, add
# patches/webhook_in_taloscontrolplanes.yaml and
# patches/cainjection_in_taloscontrolplanes.yaml under patchesStrategicMerge.
# +kubebuilder:scaffold:crdkustomizewebhookpatch
# +kubebuilder:scaffold:crdkustomizecainjectionpatch

# the following config is for teaching kustomize how to do kustomization for CRDs.
configurations:
- kustomizeconfig.yaml
